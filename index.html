<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#070b16">
<meta name="description" content="MetGames — A METXON Product">
<title>MetGames — A METXON Product</title>

<style>
:root{
  --bg:#060914;
  --panel:#0d1528;
  --panel2:#111b31;
  --line:#26375b;
  --text:#eef3ff;
  --muted:#9ba9c7;
  --blue:#5da7ff;
  --cyan:#55e7ff;
  --red:#ff5369;
  --green:#63e6a4;
  --yellow:#ffd45d;
}

*{
  box-sizing:border-box;
}

html{
  scroll-behavior:smooth;
}

body{
  margin:0;
  min-height:100vh;
  color:var(--text);
  background:
    radial-gradient(circle at 15% 0,#17345d55,transparent 35%),
    radial-gradient(circle at 85% 20%,#30205c33,transparent 30%),
    linear-gradient(#070b16,#050812);
  font-family:Segoe UI,Arial,sans-serif;
}

button,
input,
textarea,
select{
  font:inherit;
}

button{
  cursor:pointer;
}

a{
  color:#a9c8ff;
}

.shell{
  width:min(1200px,calc(100% - 40px));
  margin:auto;
}

/* =========================
   HEADER
========================= */

header{
  position:sticky;
  top:0;
  z-index:20;
  background:#050812dd;
  backdrop-filter:blur(16px);
  border-bottom:1px solid var(--line);
}

.nav{
  min-height:76px;
  display:flex;
  align-items:center;
  gap:12px;
}

.brand{
  display:flex;
  align-items:center;
  gap:10px;
  min-width:205px;
  text-decoration:none;
  color:white;
}

.brand img{
  width:48px;
  height:48px;
  object-fit:contain;
  border-radius:11px;
}

.brand b{
  display:block;
  font-size:18px;
  letter-spacing:.4px;
}

.brand small{
  display:block;
  color:var(--muted);
  font-size:9px;
  letter-spacing:1.5px;
  margin-top:1px;
}

.links{
  display:flex;
  flex:1;
  gap:3px;
}

.links button,
.network button{
  border:0;
  background:transparent;
  color:#b8c4dd;
  padding:10px 11px;
  border-radius:10px;
}

.links button:hover,
.links button.active,
.network button:hover{
  background:#ffffff0d;
  color:white;
}

.network{
  display:flex;
  border-left:1px solid var(--line);
  padding-left:6px;
}

.account{
  display:flex;
  gap:7px;
  align-items:center;
}

.primary,
.secondary,
.pill{
  border-radius:11px;
  padding:10px 14px;
}

.primary{
  border:0;
  background:linear-gradient(135deg,#5caaff,#48d8ff);
  color:#04101a;
  font-weight:800;
}

.primary:hover{
  filter:brightness(1.08);
}

.secondary,
.pill{
  border:1px solid var(--line);
  background:#ffffff08;
  color:#eef3ff;
}

.secondary:hover{
  background:#ffffff12;
}

.pill{
  border-radius:999px;
  padding:7px 10px;
}

/* =========================
   HERO
========================= */

.hero{
  padding:70px 0 35px;
  display:grid;
  grid-template-columns:1.15fr .85fr;
  gap:28px;
  align-items:center;
}

.eyebrow{
  color:var(--cyan);
  font-size:11px;
  letter-spacing:2px;
  font-weight:800;
  text-transform:uppercase;
}

h1{
  font-size:clamp(44px,7vw,78px);
  line-height:.97;
  letter-spacing:-3px;
  margin:10px 0 18px;
}

h2{
  font-size:30px;
  margin:0 0 10px;
}

h3{
  margin:0 0 5px;
}

p{
  margin-top:7px;
}

.muted{
  color:var(--muted);
}

.hero p{
  font-size:18px;
  max-width:700px;
}

.heroart{
  height:330px;
  border:1px solid var(--line);
  border-radius:28px;
  background:
    radial-gradient(circle at 35% 30%,#56d9ff33,transparent 30%),
    radial-gradient(circle at 75% 75%,#ff536922,transparent 25%),
    linear-gradient(145deg,#16294b,#080d1c);
  display:grid;
  place-items:center;
  overflow:hidden;
  box-shadow:0 25px 70px #0005;
}

.heroart img{
  width:72%;
  max-height:240px;
  object-fit:contain;
  filter:drop-shadow(0 15px 35px #0008);
}

/* =========================
   SECTIONS
========================= */

.section{
  padding:28px 0 55px;
}

.head{
  display:flex;
  justify-content:space-between;
  align-items:end;
  gap:15px;
  margin-bottom:18px;
}

.grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:17px;
}

.card{
  border:1px solid var(--line);
  border-radius:19px;
  overflow:hidden;
  background:
    linear-gradient(145deg,#141e35cc,#080d18ee);
  box-shadow:0 14px 45px #0004;
  transition:.2s ease;
}

.card:hover{
  transform:translateY(-3px);
  border-color:#3e5787;
}

.thumb{
  height:155px;
  display:grid;
  place-items:center;
  background:
    radial-gradient(circle at 30% 25%,#55e7ff3d,transparent 30%),
    radial-gradient(circle at 75% 70%,#ff536922,transparent 25%),
    linear-gradient(135deg,#111d37,#080d1c);
  font-size:54px;
}

.body{
  padding:17px;
}

.meta{
  display:flex;
  gap:7px;
  flex-wrap:wrap;
  margin:9px 0;
}

.tag{
  font-size:11px;
  border:1px solid var(--line);
  border-radius:999px;
  padding:4px 8px;
  color:#bac7e2;
}

.actions{
  display:flex;
  gap:8px;
  margin-top:13px;
}

.actions>*{
  flex:1;
}

.details{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
  margin-top:12px;
}

.detail{
  background:#ffffff06;
  border-radius:10px;
  padding:9px;
  font-size:11px;
  color:#b9c6df;
}

.detail b{
  display:block;
  color:white;
  font-size:10px;
  text-transform:uppercase;
  letter-spacing:.6px;
  margin-bottom:2px;
}

/* =========================
   BANNER
========================= */

.banner{
  padding:22px;
  border:1px solid var(--line);
  border-radius:18px;
  background:
    linear-gradient(90deg,#4380ff18,#ff4d6912);
}

/* =========================
   TABS
========================= */

.tabs{
  display:flex;
  gap:7px;
  flex-wrap:wrap;
  margin:18px 0;
}

.tabs button{
  border:1px solid var(--line);
  background:#ffffff07;
  color:#bdc9e2;
  padding:8px 11px;
  border-radius:10px;
}

.tabs button:hover,
.tabs button.active{
  color:white;
  background:#53abff18;
}

/* =========================
   FORMS
========================= */

.form{
  display:grid;
  gap:11px;
}

label{
  display:block;
  font-size:11px;
  color:#aab7d1;
  margin-bottom:5px;
}

input,
textarea,
select{
  width:100%;
  border:1px solid var(--line);
  background:#080e1d;
  color:white;
  border-radius:11px;
  padding:11px;
  outline:0;
}

input:focus,
textarea:focus,
select:focus{
  border-color:#4c78b8;
  box-shadow:0 0 0 2px #4c78b822;
}

textarea{
  min-height:95px;
  resize:vertical;
}

.row{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

/* =========================
   MODALS
========================= */

.modal{
  display:none;
  position:fixed;
  inset:0;
  z-index:100;
  background:#000b;
  backdrop-filter:blur(8px);
  place-items:center;
  padding:18px;
}

.modal.show{
  display:grid;
}

.modalbox{
  width:min(520px,100%);
  max-height:90vh;
  overflow:auto;
  background:#090f1e;
  border:1px solid var(--line);
  border-radius:22px;
  padding:24px;
  box-shadow:0 30px 100px #000b;
}

.close{
  float:right;
  border:0;
  background:none;
  color:#9da9c4;
  font-size:24px;
}

/* =========================
   MET XON TRANSITION
========================= */

#transition{
  display:none;
  position:fixed;
  inset:0;
  z-index:999;
  background:#03050b;
  place-items:center;
}

#transition.show{
  display:grid;
}

#transition div{
  font-size:clamp(60px,13vw,150px);
  font-weight:950;
  letter-spacing:-8px;
  animation:transitionPulse .45s ease;
}

.met{
  color:var(--blue);
}

.xon{
  color:var(--red);
}

@keyframes transitionPulse{
  0%{
    opacity:0;
    transform:scale(.88);
  }
  100%{
    opacity:1;
    transform:scale(1);
  }
}

/* =========================
   PLAYER
========================= */

.player{
  border:1px solid var(--line);
  border-radius:19px;
  overflow:hidden;
  background:#050814;
  margin-top:20px;
}

.player canvas{
  display:block;
  width:100%;
  height:auto;
  background:#08101e;
}

.hud{
  display:flex;
  justify-content:space-between;
  gap:12px;
  flex-wrap:wrap;
  padding:9px 12px;
  background:#080d19;
  color:#b7c3dd;
  font-size:11px;
}

/* =========================
   PROFILE
========================= */

.profile{
  display:grid;
  grid-template-columns:230px 1fr;
  gap:18px;
}

.avatar{
  width:120px;
  height:120px;
  border:1px solid var(--line);
  border-radius:50%;
  display:grid;
  place-items:center;
  font-size:45px;
  background:linear-gradient(135deg,#18284b,#0c1428);
  margin-bottom:12px;
}

.empty{
  text-align:center;
  padding:35px;
  border:1px dashed var(--line);
  border-radius:18px;
  color:#8996b2;
}

/* =========================
   FOOTER
========================= */

footer{
  border-top:1px solid var(--line);
  padding:27px 0 38px;
  color:#7785a3;
  font-size:12px;
}

footer a{
  word-break:break-all;
}

/* =========================
   RESPONSIVE
========================= */

@media(max-width:900px){

  .nav{
    flex-wrap:wrap;
    padding:9px 0;
  }

  .links{
    order:3;
    width:100%;
    overflow:auto;
  }

  .network{
    display:none;
  }

  .hero{
    grid-template-columns:1fr;
  }

  .grid{
    grid-template-columns:1fr 1fr;
  }

  .profile{
    grid-template-columns:1fr;
  }
}

@media(max-width:620px){

  .shell{
    width:min(100% - 28px,1200px);
  }

  .grid,
  .row,
  .details{
    grid-template-columns:1fr;
  }

  .hero{
    padding-top:40px;
  }

  h1{
    letter-spacing:-2px;
  }

  .brand{
    min-width:auto;
  }

  .brand b{
    font-size:15px;
  }

  .brand img{
    width:42px;
    height:42px;
  }

  .account{
    margin-left:auto;
  }
}
</style>
</head>

<!-- ==========================================
     SUPABASE
=========================================== -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

/* ==========================================
   SUPABASE CONFIGURATION
=========================================== */

const SUPABASE_URL =
"https://xnnnxinsnedjafltsuqo.supabase.co";

const SUPABASE_KEY =
"sb_publishable_86rJNEFS_sOXfsZZ6gr4ow_sLngjj_i";

const db =
supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY,
{
  auth:{
    persistSession:false,
    autoRefreshToken:false,
    detectSessionInUrl:true
  }
});


/* ==========================================
   GLOBAL STATE
=========================================== */

let session = null;

let profile = null;

let games = [];

let route =
location.hash.slice(1) || "home";

let runtime = null;


/* ==========================================
   FALLBACK METXON GAMES
=========================================== */

const demoGames = [

{
  id:"demo1",
  title:"METXON Coin Dash",
  description:
  "A quick arcade game: move, jump and collect glowing coins.",
  game_type:"2d",
  maturity_rating:"all",
  demo:true,
  emoji:"🪙",
  publisher:"METXON"
},

{
  id:"demo2",
  title:"METXON Sky Jump",
  description:
  "Jump across floating platforms and keep your character moving.",
  game_type:"2d",
  maturity_rating:"all",
  demo:true,
  emoji:"☁️",
  publisher:"METXON"
},

{
  id:"demo3",
  title:"METXON Block Breaker",
  description:
  "A simple reflex game where the ball breaks blocks.",
  game_type:"2d",
  maturity_rating:"all",
  demo:true,
  emoji:"🧱",
  publisher:"METXON"
}

];


/* ==========================================
   HELPERS
=========================================== */

function esc(value){

  return String(value ?? "")
  .replace(/[&<>"']/g,function(c){

    return {
      "&":"&amp;",
      "<":"&lt;",
      ">":"&gt;",
      '"':"&quot;",
      "'":"&#039;"
    }[c];

  });

}


function closeM(id){

  document
  .getElementById(id)
  .classList
  .remove("show");

}


function wait(ms){

  return new Promise(
    resolve => setTimeout(resolve,ms)
  );

}


/* ==========================================
   MET → XON PAGE TRANSITION
=========================================== */

async function transitionTo(to){

  const transition =
  document.getElementById("transition");

  const word =
  document.getElementById("tword");

  transition.classList.add("show");

  word.className = "met";

  word.textContent = "MET";

  await wait(220);

  word.className = "xon";

  word.textContent = "XON";

  await wait(300);

  location.hash = to;

  route = to;

  render();

  await wait(160);

  transition.classList.remove("show");

}


function go(to){

  if(route === to){

    render();

    return;

  }

  transitionTo(to);

}


/* ==========================================
   ACCOUNT UI
=========================================== */

function updateAccount(){

  const box =
  document.getElementById("account");

  if(session){

    box.innerHTML = `

      <span class="pill">
        @${esc(profile?.username || "player")}
      </span>

      <button
      class="secondary"
      onclick="logout()"
      >
      Log out
      </button>

    `;

  }else{

    box.innerHTML = `

      <button
      class="secondary"
      onclick="authOpen('login')"
      >
      Log in
      </button>

      <button
      class="primary"
      onclick="authOpen('register')"
      >
      Join
      </button>

    `;

  }

}


/* ==========================================
   AUTH
=========================================== */

function authOpen(mode){

  document.getElementById("authBox").innerHTML = `

    <div class="eyebrow">
      METGAMES ACCOUNT
    </div>

    <h2>
      ${mode === "login"
        ? "Welcome back"
        : "Join MetGames"}
    </h2>

    <p class="muted">
      ${mode === "login"
        ? "Log in to play and create."
        : "Create an account to play and build."}
    </p>

    <form
    class="form"
    onsubmit="${mode === "login"
      ? "login(event)"
      : "register(event)"}"
    >

      ${
        mode === "register"
        ?
        `

        <div class="row">

          <div>

            <label>
              Display name
            </label>

            <input
            name="display"
            required
            >

          </div>

          <div>

            <label>
              Username
            </label>

            <input
            name="username"
            required
            >

          </div>

        </div>


        <div>

          <label>
            Age category
          </label>

          <select
          name="age"
          required
          >

            <option value="">
              Select
            </option>

            <option>
              13–15
            </option>

            <option>
              16–17
            </option>

            <option>
              18+
            </option>

          </select>

        </div>

        `
        :
        ""
      }


      <div>

        <label>
          Email
        </label>

        <input
        name="email"
        type="email"
        required
        >

      </div>


      <div>

        <label>
          Password
        </label>

        <input
        name="password"
        type="password"
        minlength="6"
        required
        >

      </div>


      <button
      class="primary"
      type="submit"
      >

      ${
        mode === "login"
        ? "Log in"
        : "Create account"
      }

      </button>

    </form>


    <p class="muted">

      ${
        mode === "login"
        ? "New here?"
        : "Already have an account?"
      }

      <button
      class="secondary"
      onclick="authOpen('${
        mode === "login"
        ? "register"
        : "login"
      }')"
      >

      ${
        mode === "login"
        ? "Join"
        : "Log in"
      }

      </button>

    </p>

  `;

  document
  .getElementById("auth")
  .classList
  .add("show");

}


async function login(event){

  event.preventDefault();

  const form =
  new FormData(event.target);

  const result =
  await db.auth.signInWithPassword({

    email:form.get("email"),

    password:form.get("password")

  });


  if(result.error){

    alert(result.error.message);

    return;

  }


  session =
  result.data.session;

  await loadProfile();

  updateAccount();

  closeM("auth");

  render();

}


async function register(event){

  event.preventDefault();

  const form =
  new FormData(event.target);

  const result =
  await db.auth.signUp({

    email:form.get("email"),

    password:form.get("password"),

    options:{
      data:{
        display_name:
        form.get("display"),

        username:
        form.get("username"),

        age_category:
        form.get("age")
      }
    }

  });


  if(result.error){

    alert(result.error.message);

    return;

  }


  if(result.data.session){

    session =
    result.data.session;

    await loadProfile();

  }else{

    alert(
      "Account created. Please check your email if confirmation is required."
    );

  }


  updateAccount();

  closeM("auth");

  render();

}


async function logout(){

  await db.auth.signOut();

  session = null;

  profile = null;

  updateAccount();

  go("home");

}


/* ==========================================
   PROFILE
=========================================== */

async function loadProfile(){

  if(!session){

    return;

  }

  const result =
  await db
  .from("profiles")
  .select("*")
  .eq("id",session.user.id)
  .maybeSingle();


  profile =
  result.data ||
  {
    username:
    session.user.email.split("@")[0]
  };

}


/* ==========================================
   LOAD GAMES
=========================================== */

async function loadGames(){

  const result =
  await db
  .from("games")
  .select("*")
  .eq("status","published")
  .order(
    "published_at",
    {
      ascending:false
    }
  )
  .limit(60);


  if(result.data && result.data.length){

    games = result.data;

  }else{

    games = demoGames;

  }

}


/* ==========================================
   GAME CARD
=========================================== */

function gameCard(game){

  const isMetxon =
  game.demo ||
  game.publisher === "METXON";


  return `

  <article class="card">

    <div class="thumb">

      ${game.emoji || "🎮"}

    </div>


    <div class="body">

      <h3>
        ${esc(game.title)}
      </h3>


      <div class="muted">

        ${
          isMetxon
          ? "Created by METXON"
          : "Created by a MetGames creator"
        }

      </div>


      <p class="muted">

        ${esc(game.description || "")}

      </p>


      <div class="meta">

        <span class="tag">

          ${esc(
            (game.game_type || "2d")
            .toUpperCase()
          )}

        </span>


        <span class="tag">

          ${esc(
            game.maturity_rating || "all"
          )}

        </span>

      </div>


      ${
        isMetxon
        ?
        `

        <div class="details">

          <div class="detail">

            <b>

    alert(result.error.message);

    return;

  closeM("modal");

  await loadGames();

  render();

/* ==========================================
   GAME PREVIEW
=========================================== */

function drawGamePreview(game){

  const canvas =
  document.getElementById("canvas");

  if(!canvas){

    return;

  }


  const ctx =
  canvas.getContext("2d");


  ctx.fillStyle =
  "#08101e";

  ctx.fillRect(
    0,
    0,
    canvas.width,
    canvas.height
  );


  /* Grid */

  ctx.strokeStyle =
  "#55e7ff12";

  for(let i=0;i<32;i++){

    ctx.fillRect(
      i * 30,
      0,
      1,
      canvas.height
    );

  }


  for(let i=0;i<16;i++){

    ctx.fillRect(
      0,
      i * 30,
      canvas.width,
      1
    );

  }


  /* Ground */

  ctx.fillStyle =
  "#5da7ff";

  ctx.fillRect(
    30,
    380,
    900,
    25
  );


  /* Player */

  ctx.fillStyle =
  "#63e6a4";

  ctx.fillRect(
    70,
    335,
    42,
    45
  );


  /* Enemy */

  ctx.fillStyle =
  "#ff5369";

  ctx.fillRect(
    620,
    340,
    30,
    40
  );


  /* Coin */

  ctx.fillStyle =
  "#ffd45d";

  ctx.beginPath();

  ctx.arc(
    420,
    300,
    13,
    0,
    Math.PI * 2
  );

  ctx.fill();


  /* Text */

  ctx.fillStyle =
  "#eef3ff";

  ctx.font =
  "700 17px Segoe UI";

  ctx.fillText(
    "Press Play to start · A/D or ←/→ · Space to jump",
    30,
    40
  );

}

async function playGame(id){

  if(!session){

    authOpen("login");

    return;

  }


  /*
    Real published games use the

  */

  if(!String(id).startsWith("demo")){

    const result =
    await db.rpc(
      "increment_game_launch",
      {

    if(result.error){

      console.warn(
        "Launch counter:",
        result.error.message
      );

      alert(
        "The game runtime is ready, but the daily launch counter still needs to be connected."
      );

    }

  }


  startRuntime();

}


/* ==========================================
   SIMPLE 2D RUNTIME
=========================================== */

function startRuntime(){

  const canvas =
  document.getElementById("canvas");

  if(!canvas){

    return;

  }


  const ctx =
  canvas.getContext("2d");


  let playerX = 100;

  let playerY = 335;

  let velocityY = 0;

  let keys = {};

  let last =
  performance.now();

  let frames = 0;

  let fpsStamp =
  last;


  /*
    Controls
  */

  addEventListener(
    "keydown",
    function(event){

      keys[
        event.key.toLowerCase()
      ] = true;

    }
  );


  addEventListener(
    "keyup",
    function(event){

      keys[
        event.key.toLowerCase()
      ] = false;

    }
  );


  cancelAnimationFrame(
    runtime
  );


  function loop(time){

    const dt =
    Math.min(
      .033,
      (time-last)/1000
    );


    last = time;


    /*
      Movement
    */

    if(
      keys.a ||
      keys.arrowleft
    ){

      playerX -=
      220 * dt;

    }


    if(
      keys.d ||
      keys.arrowright
    ){

      playerX +=
      220 * dt;

    }


    /*
      Jump
    */

    if(
      (
        keys[" "] ||
        keys.w ||
        keys.arrowup
      )
      &&
      playerY >= 335
    ){

      velocityY =
      -430;

    }


    velocityY +=
    980 * dt;

    playerY +=
    velocityY * dt;


    if(playerY > 335){

      playerY = 335;

      velocityY = 0;

    }


    playerX =
    Math.max(
      30,
      Math.min(
        890,
        playerX
      )
    );


    /*
      Background
    */

    ctx.fillStyle =
    "#08101e";

    ctx.fillRect(
      0,
      0,
      canvas.width,
      canvas.height
    );


    /*
      Grid
    */

    ctx.fillStyle =
    "#55e7ff12";

    for(let i=0;i<32;i++){

      ctx.fillRect(
        i*30,
        0,
        1,
        canvas.height
      );

    }


    /*
      Ground
    */

    ctx.fillStyle =
    "#5da7ff";

    ctx.fillRect(
      30,
      380,
      900,
      25
    );


    /*
      Player
    */

    ctx.fillStyle =
    "#63e6a4";

    ctx.fillRect(
      playerX,
      playerY,
      42,
      45
    );


    /*
      Enemy
    */

    ctx.fillStyle =
    "#ff5369";

    ctx.fillRect(
      620,
      340,
      30,
      40
    );


    /*
      Coin
    */

    ctx.fillStyle =
    "#ffd45d";

    ctx.beginPath();

    ctx.arc(
      420,
      300,
      13,
      0,
      Math.PI*2
    );

    ctx.fill();


    /*
      Instructions
    */

    ctx.fillStyle =
    "#eef3ff";

    ctx.font =
    "700 17px Segoe UI";

    ctx.fillText(
      "A/D or arrows: move · Space: jump",
      30,
      35
    );


    /*
      FPS
    */

    frames++;


    if(
      time-fpsStamp > 500
    ){

      const fps =
      Math.round(
        frames * 1000 /
        (time-fpsStamp)
      );


      const fpsElement =
      document.getElementById("fps");


      if(fpsElement){

        fpsElement.textContent =
        "FPS " + fps;

      }


      frames = 0;

      fpsStamp =
      time;

    }


    runtime =
    requestAnimationFrame(
      loop
    );

  }


  runtime =
  requestAnimationFrame(
    loop
  );

}


/* ==========================================
   MAIN ROUTER
=========================================== */

function render(){

  const [page,id] =
  route.split("/");


  document
  .querySelectorAll("[data-n]")
  .forEach(
    button => {

      button.classList.toggle(
        "active",
        button.dataset.n === page
      );

    }
  );


  if(
    page === "game" &&
    id
  ){

    gamePage(id);

    return;

  }


  if(page === "play"){

    playPage();

    return;

  }


  if(page === "trailers"){

    trailerPage();

    return;

  }


  if(page === "create"){

    createPage();

    return;

  }


  if(page === "profile"){

    profilePage();

    return;

  }


  homePage();

}


/* ==========================================
   START APPLICATION
=========================================== */

async function boot(){

  const auth =
  await db.auth.getSession();


  session =
  auth.data.session;


  if(session){

    await loadProfile();

  }


  await loadGames();


  updateAccount();

  render();


  db.auth.onAuthStateChange(
    async function(_event,newSession){

      session =
      newSession;


      if(newSession){

        await loadProfile();

      }else{

        profile = null;

      }


      updateAccount();

    }
  );

}


boot();
