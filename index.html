<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>METGAMES — A METXON PRODUCT</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
:root{
  --bg:#070912;
  --panel:#101522;
  --panel2:#151c2c;
  --line:#273149;
  --text:#f5f7ff;
  --muted:#8e99b2;
  --blue:#38a8ff;
  --cyan:#36e4ff;
  --red:#ff3f63;
  --green:#45e69a;
}

*{box-sizing:border-box}

body{
  margin:0;
  background:
    radial-gradient(circle at 20% 0%,rgba(35,150,255,.12),transparent 35%),
    radial-gradient(circle at 90% 20%,rgba(255,40,90,.10),transparent 30%),
    var(--bg);
  color:var(--text);
  font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  min-height:100vh;
}

button,input,textarea,select{
  font:inherit;
}

button{
  cursor:pointer;
}

a{
  color:inherit;
  text-decoration:none;
}

/* ---------- TRANSITION ---------- */

#transition{
  position:fixed;
  inset:0;
  z-index:99999;
  background:#03050a;
  display:flex;
  align-items:center;
  justify-content:center;
  pointer-events:none;
  opacity:0;
  visibility:hidden;
  transition:opacity .2s ease;
}

#transition.show{
  opacity:1;
  visibility:visible;
}

.transition-word{
  font-size:clamp(48px,10vw,130px);
  font-weight:1000;
  letter-spacing:-8px;
  color:white;
}

.transition-word .met{
  color:#39a9ff;
}

.transition-word .xon{
  color:#ff4167;
  opacity:0;
  transform:translateX(30px);
  display:inline-block;
  transition:.45s ease;
}

#transition.reveal .xon{
  opacity:1;
  transform:translateX(0);
}

/* ---------- HEADER ---------- */

header{
  height:76px;
  border-bottom:1px solid rgba(255,255,255,.07);
  background:rgba(7,9,18,.86);
  backdrop-filter:blur(18px);
  display:flex;
  align-items:center;
  padding:0 28px;
  position:sticky;
  top:0;
  z-index:1000;
}

.brand{
  display:flex;
  align-items:center;
  gap:12px;
  min-width:210px;
}

.brand img{
  width:150px;
  max-height:50px;
  object-fit:contain;
}

.brand-fallback{
  display:none;
  font-size:25px;
  font-weight:1000;
  letter-spacing:-1px;
}

nav{
  display:flex;
  align-items:center;
  gap:6px;
  flex:1;
}

nav button{
  background:none;
  border:0;
  color:#aeb7cb;
  padding:10px 13px;
  border-radius:10px;
  font-weight:700;
}

nav button:hover,
nav button.active{
  color:white;
  background:rgba(255,255,255,.07);
}

.account{
  display:flex;
  align-items:center;
  gap:10px;
}

.account-name{
  color:#aeb7cb;
  font-size:14px;
}

.btn{
  border:1px solid var(--line);
  background:var(--panel2);
  color:white;
  padding:10px 15px;
  border-radius:10px;
  font-weight:800;
}

.btn:hover{
  border-color:#456080;
}

.btn.primary{
  background:linear-gradient(135deg,#258cff,#35caff);
  border:0;
  color:#03101c;
}

.btn.danger{
  background:#32141d;
  border-color:#5d2634;
}

.btn.green{
  background:#113c2d;
  border-color:#24694d;
  color:#8dffca;
}

/* ---------- APP ---------- */

#app{
  max-width:1400px;
  margin:auto;
  padding:35px 25px 80px;
}

.hero{
  min-height:480px;
  display:grid;
  grid-template-columns:1.2fr .8fr;
  align-items:center;
  gap:40px;
}

.hero h1{
  font-size:clamp(48px,8vw,100px);
  line-height:.88;
  margin:0 0 25px;
  letter-spacing:-7px;
}

.gradient{
  background:linear-gradient(90deg,#35a6ff,#55e5ff,#ff466b);
  -webkit-background-clip:text;
  color:transparent;
}

.hero p{
  max-width:650px;
  color:#a6afc2;
  line-height:1.7;
  font-size:17px;
}

.hero-actions{
  display:flex;
  gap:12px;
  margin-top:25px;
  flex-wrap:wrap;
}

.hero-card{
  background:linear-gradient(145deg,#111a2a,#0b101b);
  border:1px solid var(--line);
  border-radius:25px;
  padding:30px;
  box-shadow:0 30px 80px rgba(0,0,0,.3);
}

.hero-card h3{
  margin-top:0;
}

.hero-card p{
  font-size:14px;
}

/* ---------- SECTIONS ---------- */

.section-title{
  display:flex;
  align-items:end;
  justify-content:space-between;
  gap:20px;
  margin:35px 0 17px;
}

.section-title h2{
  margin:0;
  font-size:27px;
}

.section-title span{
  color:var(--muted);
  font-size:14px;
}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(240px,1fr));
  gap:17px;
}

.card{
  background:linear-gradient(145deg,#111827,#0c111c);
  border:1px solid var(--line);
  border-radius:16px;
  overflow:hidden;
  transition:.2s ease;
}

.card:hover{
  transform:translateY(-3px);
  border-color:#3a4967;
}

.thumbnail{
  height:145px;
  background:
    linear-gradient(135deg,rgba(45,159,255,.4),rgba(255,50,100,.35)),
    #101728;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:30px;
  font-weight:1000;
}

.card-body{
  padding:15px;
}

.card h3{
  margin:0 0 6px;
}

.card p{
  color:var(--muted);
  font-size:13px;
  line-height:1.5;
}

.meta{
  display:flex;
  gap:7px;
  flex-wrap:wrap;
  margin-top:10px;
}

.tag{
  border:1px solid var(--line);
  padding:4px 8px;
  border-radius:7px;
  color:#aeb9cd;
  font-size:11px;
}

.empty{
  border:1px dashed #2c3950;
  padding:40px;
  border-radius:15px;
  text-align:center;
  color:var(--muted);
}

/* ---------- AUTH ---------- */

.modal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.72);
  backdrop-filter:blur(12px);
  display:none;
  align-items:center;
  justify-content:center;
  z-index:9000;
  padding:20px;
}

.modal.open{
  display:flex;
}

.modal-box{
  width:min(480px,100%);
  background:#0d1320;
  border:1px solid #2a3750;
  border-radius:20px;
  padding:28px;
  box-shadow:0 30px 100px rgba(0,0,0,.6);
}

.modal-box h2{
  margin-top:0;
}

.form{
  display:grid;
  gap:13px;
}

label{
  color:#aeb9cd;
  font-size:13px;
  font-weight:700;
}

input,textarea,select{
  width:100%;
  background:#080d17;
  border:1px solid #29364e;
  color:white;
  padding:12px;
  border-radius:9px;
  outline:none;
}

input:focus,textarea:focus,select:focus{
  border-color:#398fd0;
}

textarea{
  min-height:100px;
  resize:vertical;
}

.form-row{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
}

.form-error{
  color:#ff7089;
  font-size:13px;
}

.switch{
  color:#8fa0ba;
  font-size:13px;
  text-align:center;
  margin-top:12px;
}

.switch button{
  border:0;
  background:none;
  color:#46b8ff;
}

/* ---------- CREATOR ---------- */

.creator-layout{
  display:grid;
  grid-template-columns:240px 1fr 260px;
  min-height:600px;
  gap:15px;
}

.creator-panel{
  background:#0d1320;
  border:1px solid var(--line);
  border-radius:15px;
  padding:15px;
}

.creator-panel h3{
  margin-top:0;
}

.tool{
  width:100%;
  text-align:left;
  margin-bottom:8px;
}

.canvas-wrap{
  background:#060910;
  border:1px solid var(--line);
  border-radius:15px;
  padding:15px;
  overflow:auto;
}

#gameCanvas{
  display:block;
  background:
    linear-gradient(rgba(255,255,255,.04) 1px,transparent 1px),
    linear-gradient(90deg,rgba(255,255,255,.04) 1px,transparent 1px),
    #101724;
  background-size:25px 25px;
  border-radius:8px;
  max-width:100%;
  touch-action:none;
}

.creator-actions{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
  margin-bottom:15px;
}

.object-list{
  max-height:250px;
  overflow:auto;
}

.object-row{
  display:flex;
  justify-content:space-between;
  gap:5px;
  padding:8px;
  margin-bottom:5px;
  border:1px solid #243047;
  border-radius:7px;
  font-size:12px;
}

.object-row.selected{
  border-color:#38a8ff;
}

.status{
  font-size:12px;
  color:#7f91ac;
}

/* ---------- GAME PLAYER ---------- */

.player-shell{
  max-width:1100px;
  margin:auto;
}

.player-top{
  display:flex;
  justify-content:space-between;
  gap:15px;
  align-items:center;
  margin-bottom:15px;
}

#playCanvas{
  width:100%;
  max-width:1000px;
  height:auto;
  aspect-ratio:16/9;
  background:#101724;
  border:1px solid var(--line);
  border-radius:15px;
  display:block;
  touch-action:none;
}

.play-info{
  margin-top:15px;
  background:#0d1320;
  border:1px solid var(--line);
  border-radius:15px;
  padding:18px;
}

.play-info h1{
  margin:0;
}

.rating-row{
  display:flex;
  gap:7px;
  align-items:center;
  margin-top:12px;
}

.star{
  border:0;
  background:none;
  font-size:23px;
  color:#68748b;
  padding:0;
}

.star.active{
  color:#ffd45a;
}

/* ---------- PROFILE ---------- */

.profile{
  max-width:800px;
  margin:auto;
}

.profile-head{
  background:#0d1320;
  border:1px solid var(--line);
  border-radius:18px;
  padding:25px;
  display:flex;
  gap:20px;
  align-items:center;
}

.avatar{
  width:80px;
  height:80px;
  border-radius:50%;
  background:linear-gradient(135deg,#35a8ff,#ff3d67);
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:1000;
  font-size:28px;
}

/* ---------- FOOTER ---------- */

footer{
  border-top:1px solid rgba(255,255,255,.07);
  padding:25px;
  text-align:center;
  color:#69758d;
  font-size:12px;
}

footer a{
  color:#48baff;
}

@media(max-width:950px){
  .hero{
    grid-template-columns:1fr;
  }

  .creator-layout{
    grid-template-columns:1fr;
  }

  header{
    height:auto;
    min-height:76px;
    flex-wrap:wrap;
    padding:12px;
  }

  .brand{
    min-width:auto;
  }

  nav{
    order:3;
    width:100%;
    overflow:auto;
  }

  .account-name{
    display:none;
  }
}

@media(max-width:600px){
  #app{
    padding:20px 13px 60px;
  }

  .hero h1{
    letter-spacing:-4px;
  }

  .form-row{
    grid-template-columns:1fr;
  }
}
</style>
</head>

<body>

<div id="transition">
  <div class="transition-word">
    <span class="met">MET</span><span class="xon">XON</span>
  </div>
</div>

<header>
  <a class="brand" href="#home" onclick="navigate('home')">
    <img src="image.png" alt="METGAMES" onerror="this.style.display='none';document.querySelector('.brand-fallback').style.display='block'">
    <span class="brand-fallback">METGAMES</span>
  </a>

  <nav>
    <button data-nav="home" onclick="navigate('home')">Home</button>
    <button data-nav="play" onclick="navigate('play')">Play</button>
    <button data-nav="trailers" onclick="navigate('trailers')">Watch Trailers</button>
    <button data-nav="create" onclick="navigate('create')">Create</button>
    <button data-nav="profile" onclick="navigate('profile')">Profile</button>
  </nav>

  <div class="account">
    <span class="account-name" id="accountName">Guest</span>
    <button class="btn" id="accountButton" onclick="openAuth()">Login</button>
  </div>
</header>

<main id="app"></main>

<footer>
  <div>© 2026 METGAMES — A METXON PRODUCT</div>
  <div style="margin-top:7px">
    Original Metxon website:
    <a href="https://nidhilarthicknet.github.io/metxon/" target="_blank">
      nidhilarthicknet.github.io/metxon
    </a>
  </div>
</footer>

<!-- AUTH -->

<div class="modal" id="authModal">
  <div class="modal-box">
    <h2 id="authTitle">Login to METGAMES</h2>

    <form class="form" id="authForm">

      <div id="registerFields" style="display:none">
        <div class="form">
          <div>
            <label>Username</label>
            <input id="username" autocomplete="username">
          </div>

          <div>
            <label>Display name</label>
            <input id="displayName">
          </div>

          <div>
            <label>Age category</label>
            <select id="ageCategory">
              <option value="under_13">Under 13</option>
              <option value="13_15">13–15</option>
              <option value="16_17">16–17</option>
              <option value="18_plus">18+</option>
            </select>
          </div>
        </div>
      </div>

      <div>
        <label>Email</label>
        <input id="email" type="email" required autocomplete="email">
      </div>

      <div>
        <label>Password</label>
        <input id="password" type="password" required autocomplete="current-password">
      </div>

      <div id="authError" class="form-error"></div>

      <button class="btn primary" type="submit" id="authSubmit">
        Login
      </button>
    </form>

    <div class="switch">
      <span id="switchText">New to METGAMES?</span>
      <button onclick="toggleAuthMode()" id="switchButton">Create account</button>
    </div>

    <div style="text-align:center;margin-top:15px">
      <button class="btn" onclick="closeAuth()">Close</button>
    </div>
  </div>
</div>

<script>
/* ============================================================
   METGAMES SUPABASE CONFIG
   ============================================================ */

const SUPABASE_URL = "https://xnnnxinsnedjafltsuqo.supabase.co";
const SUPABASE_KEY = "sb_publishable_86rJNEFS_sOXfsZZ6gr4ow_sLngjj_i";

const { createClient } = supabase;

const db = createClient(
  SUPABASE_URL,
  SUPABASE_KEY,
  {
    auth:{
      persistSession:false,
      autoRefreshToken:false,
      detectSessionInUrl:true
    }
  }
);

/* ============================================================
   STATE
   ============================================================ */

let currentUser = null;
let currentProfile = null;
let currentPage = "home";

let editor = {
  game:null,
  version:null,
  objects:[],
  selected:null,
  dirty:false,
  testMode:false
};

let authMode = "login";

/* ============================================================
   MET → LOADING → XON
   ============================================================ */

async function transition(){
  const t = document.getElementById("transition");

  t.classList.add("show");
  t.classList.remove("reveal");

  await sleep(350);

  await sleep(250);

  t.classList.add("reveal");

  await sleep(450);

  t.classList.remove("show","reveal");

  await sleep(120);
}

function sleep(ms){
  return new Promise(resolve=>setTimeout(resolve,ms));
}

/* ============================================================
   AUTH
   ============================================================ */

async function refreshUser(){
  const {data,error} = await db.auth.getUser();

  if(error || !data.user){
    currentUser=null;
    currentProfile=null;
    updateAccountUI();
    return;
  }

  currentUser=data.user;

  const {data:profile} = await db
    .from("profiles")
    .select("*")
    .eq("id",currentUser.id)
    .maybeSingle();

  currentProfile=profile;

  updateAccountUI();
}

function updateAccountUI(){
  const name=document.getElementById("accountName");
  const button=document.getElementById("accountButton");

  if(currentUser){
    name.textContent=currentProfile?.username || currentUser.email;
    button.textContent="Logout";
    button.onclick=logout;
  }else{
    name.textContent="Guest";
    button.textContent="Login";
    button.onclick=openAuth;
  }
}

function openAuth(){
  document.getElementById("authModal").classList.add("open");
}

function closeAuth(){
  document.getElementById("authModal").classList.remove("open");
  document.getElementById("authError").textContent="";
}

function toggleAuthMode(){
  authMode=authMode==="login"?"register":"login";

  document.getElementById("authTitle").textContent =
    authMode==="login"
    ? "Login to METGAMES"
    : "Create your METGAMES account";

  document.getElementById("registerFields").style.display =
    authMode==="register" ? "block":"none";

  document.getElementById("authSubmit").textContent =
    authMode==="login" ? "Login":"Create account";

  document.getElementById("switchText").textContent =
    authMode==="login" ? "New to METGAMES?":"Already have an account?";

  document.getElementById("switchButton").textContent =
    authMode==="login" ? "Create account":"Login";
}

document.getElementById("authForm").addEventListener("submit",async e=>{
  e.preventDefault();

  const email=document.getElementById("email").value.trim();
  const password=document.getElementById("password").value;
  const errorBox=document.getElementById("authError");

  errorBox.textContent="";

  try{
    if(authMode==="login"){
      const {error}=await db.auth.signInWithPassword({
        email,
        password
      });

      if(error) throw error;

      await refreshUser();
      closeAuth();
      navigate("profile");
    }else{
      const username=document.getElementById("username").value.trim();
      const displayName=document.getElementById("displayName").value.trim();
      const ageCategory=document.getElementById("ageCategory").value;

      if(!username){
        throw new Error("Username is required.");
      }

      const {data,error}=await db.auth.signUp({
        email,
        password,
        options:{
          data:{
            username,
            display_name:displayName,
            age_category:ageCategory
          }
        }
      });

      if(error) throw error;

      if(data.session){
        await refreshUser();
        closeAuth();
        navigate("profile");
      }else{
        errorBox.textContent=
          "Account created. Check your email if email confirmation is enabled.";
      }
    }
  }catch(err){
    errorBox.textContent=err.message || "Authentication failed.";
  }
});

async function logout(){
  await db.auth.signOut();
  currentUser=null;
  currentProfile=null;
  updateAccountUI();
  navigate("home");
}

/* ============================================================
   NAVIGATION
   ============================================================ */

async function navigate(page, options={}){
  if(page==="create" && !currentUser){
    openAuth();
    return;
  }

  if(page==="profile" && !currentUser){
    openAuth();
    return;
  }

  await transition();

  currentPage=page;

  document.querySelectorAll("[data-nav]").forEach(btn=>{
    btn.classList.toggle("active",btn.dataset.nav===page);
  });

  if(page==="home") await renderHome();
  if(page==="play") await renderPlay();
  if(page==="trailers") await renderTrailers();
  if(page==="create") await renderCreate();
  if(page==="profile") await renderProfile();
  if(page==="game") await renderGame(options.gameId);
}

/* ============================================================
   HOME
   ============================================================ */

async function renderHome(){
  const app=document.getElementById("app");

  app.innerHTML=`
    <section class="hero">
      <div>
        <div class="tag" style="display:inline-block;margin-bottom:18px">
          A METXON PRODUCT
        </div>

        <h1>
          PLAY.<br>
          CREATE.<br>
          <span class="gradient">SHARE.</span>
        </h1>

        <p>
          METGAMES is a creator-first gaming platform where players
          discover games and creators build their own worlds.
        </p>

        <div class="hero-actions">
          <button class="btn primary" onclick="navigate('play')">
            Explore Games
          </button>

          <button class="btn" onclick="navigate('create')">
            Create a Game
          </button>
        </div>
      </div>

      <div class="hero-card">
        <h3>METGAMES</h3>
        <p>
          Build your own games, publish them to the platform,
          and let players around the world discover and play them.
        </p>

        <div class="meta">
          <span class="tag">2D Creator</span>
          <span class="tag">3D Creator — Coming Next</span>
          <span class="tag">Cloud Projects</span>
          <span class="tag">Creator Profiles</span>
        </div>
      </div>
    </section>

    <div class="section-title">
      <h2>Featured Games</h2>
      <span>Publicly available games</span>
    </div>

    <div id="featuredGames" class="grid">
      <div class="empty">Loading games...</div>
    </div>
  `;

  await loadGameCards("featuredGames",6);
}

/* ============================================================
   GAME DISCOVERY
   ============================================================ */

async function loadGameCards(elementId,limit=20){
  const el=document.getElementById(elementId);
  if(!el)return;

  const {data,error}=await db
    .from("games")
    .select(`
      id,
      title,
      description,
      game_type,
      maturity_rating,
      published_at,
      owner_id
    `)
    .eq("status","published")
    .order("published_at",{ascending:false})
    .limit(limit);

  if(error){
    el.innerHTML=`<div class="empty">${escapeHtml(error.message)}</div>`;
    return;
  }

  if(!data.length){
    el.innerHTML=`
      <div class="empty">
        No published games yet.<br>
        Create the first METGAME.
      </div>
    `;
    return;
  }

  const ownerIds=[...new Set(data.map(g=>g.owner_id))];

  const {data:profiles}=await db
    .from("profiles")
    .select("id,username")
    .in("id",ownerIds);

  const profileMap={};

  (profiles||[]).forEach(p=>{
    profileMap[p.id]=p;
  });

  el.innerHTML=data.map(g=>`
    <article class="card">
      <div class="thumbnail">
        ${g.game_type==="3d" ? "3D":"2D"}
      </div>

      <div class="card-body">
        <h3>${escapeHtml(g.title)}</h3>

function drawEditor(){
  const canvas=document.getElementById("gameCanvas");
  if(!canvas)return;

  const ctx=canvas.getContext("2d");

  ctx.clearRect(0,0,canvas.width,canvas.height);

  ctx.fillStyle="#101724";
  ctx.fillRect(0,0,canvas.width,canvas.height);

  editor.objects.forEach(o=>{
    ctx.fillStyle=o.color||"#ffffff";

    if(o.type==="coin"){
      ctx.beginPath();
      ctx.arc(
        o.x+o.width/2,
        o.y+o.height/2,
        Math.min(o.width,o.height)/2,
        0,
        Math.PI*2
      );
      ctx.fill();
    }else{
      ctx.fillRect(o.x,o.y,o.width,o.height);
    }

    if(o.type==="text"){
      ctx.fillStyle=o.color||"#fff";
      ctx.font="22px Arial";
      ctx.fillText(o.text||"METGAME",o.x,o.y+25);
    }

    if(editor.selected===o.id){
      ctx.strokeStyle="#ffffff";
      ctx.lineWidth=2;
      ctx.strokeRect(o.x-3,o.y-3,o.width+6,o.height+6);
    }
  });
}

function bindCanvas(){
  const canvas=document.getElementById("gameCanvas");
  if(!canvas)return;

  let dragging=false;
  let offsetX=0;
  let offsetY=0;

  canvas.onpointerdown=e=>{
    const rect=canvas.getBoundingClientRect();

    const x=(e.clientX-rect.left)*(canvas.width/rect.width);
    const y=(e.clientY-rect.top)*(canvas.height/rect.height);

    const hit=[...editor.objects]
      .reverse()
      .find(o=>x>=o.x&&x<=o.x+o.width&&y>=o.y&&y<=o.y+o.height);

    if(!hit)return;

    editor.selected=hit.id;
    dragging=true;

    offsetX=x-hit.x;
    offsetY=y-hit.y;

    renderObjectList();
    renderProperties();
    drawEditor();
  };

  canvas.onpointermove=e=>{
    if(!dragging || editor.testMode)return;

    const o=editor.objects.find(x=>x.id===editor.selected);
    if(!o)return;

    const rect=canvas.getBoundingClientRect();

    const x=(e.clientX-rect.left)*(canvas.width/rect.width);
    const y=(e.clientY-rect.top)*(canvas.height/rect.height);

    o.x=Math.max(0,Math.min(canvas.width-o.width,x-offsetX));
    o.y=Math.max(0,Math.min(canvas.height-o.height,y-offsetY));

    editor.dirty=true;
    drawEditor();
    renderProperties();
  };

  canvas.onpointerup=()=>dragging=false;
  canvas.onpointercancel=()=>dragging=false;
}

function addObject(type){
  const defaults={
    player:{width:40,height:40,color:"#35a8ff"},
    platform:{width:140,height:30,color:"#536481"},
    enemy:{width:40,height:40,color:"#ff4167"},
    coin:{width:25,height:25,color:"#ffd34e"},
    text:{width:150,height:30,color:"#ffffff",text:"METGAMES"}
  };

  const d=defaults[type];

  const o={
    id:crypto.randomUUID(),
    type,
    x:100+Math.random()*300,
    y:100+Math.random()*200,
    ...d
  };

  editor.objects.push(o);
  editor.selected=o.id;
  editor.dirty=true;

  renderEditor();
}

  el.innerHTML=editor.objects.map((o,i)=>`

function deleteObject(id){
  editor.objects=editor.objects.filter(o=>o.id!==id);

  if(editor.selected===id){
    editor.selected=null;

  editor.dirty=true;

  renderObjectList();

}

function renderProperties(){
  const el=document.getElementById("properties");
  if(!el)return;

function changeObject(property,value){
  const o=editor.objects.find(x=>x.id===editor.selected);
  if(!o)return;

  if(["x","y","width","height"].includes(property)){
    o[property]=Number(value);
  }else{
    o[property]=value;
  }

  editor.dirty=true;
  drawEditor();
}

async function saveProject(){
  if(!currentUser || !editor.game)return;

  const manifest={
    engine:"metgames-2d-mvp",
    schema:1,
    objects:editor.objects
  };

  let versionId=editor.version?.id;

  if(versionId){
    const {error}=await db
      .from("game_versions")
      .update({
        asset_manifest:manifest
      })
      .eq("id",versionId)
      .eq("game_id",editor.game.id);

    if(error){
      alert(error.message);
      return;
    }
  }else{
    const {data:versions}=await db
      .from("game_versions")
      .select("version_number")
      .eq("game_id",editor.game.id)
      .order("version_number",{ascending:false})
      .limit(1);

    const next=(versions?.[0]?.version_number||0)+1;

    const {data,error}=await db
      .from("game_versions")
      .insert({
        game_id:editor.game.id,
        version_number:next,
        status:"draft",
        asset_manifest:manifest,
        created_by:currentUser.id
      })
      .select()
      .single();

    if(error){
      alert(error.message);
      return;
    }

    editor.version=data;
  }

  await db
    .from("games")
    .update({
      updated_at:new Date().toISOString()
    })
    .eq("id",editor.game.id)
    .eq("owner_id",currentUser.id);

  editor.dirty=false;

  alert("Project saved to Supabase.");
}

}

function startPublishedGame(manifest,game){
  const canvas=document.getElementById("playCanvas");
  if(!canvas)return;

  const ctx=canvas.getContext("2d");

  const objects=(manifest?.objects||[]).map(o=>({...o}));

  let player=objects.find(o=>o.type==="player");

  if(!player){
    player={
      type:"player",
      x:100,
      y:350,
      width:40,
      height:40,
      color:"#35a8ff"
    };

    objects.push(player);
  }

  let left=false;
  let right=false;
  let jump=false;
  let velocityY=0;

  function keyDown(e){
    if(e.key==="ArrowLeft"||e.key.toLowerCase()==="a")left=true;
    if(e.key==="ArrowRight"||e.key.toLowerCase()==="d")right=true;
    if(e.key==="ArrowUp"||e.key===" ")jump=true;
  }

  function keyUp(e){
    if(e.key==="ArrowLeft"||e.key.toLowerCase()==="a")left=false;
    if(e.key==="ArrowRight"||e.key.toLowerCase()==="d")right=false;
    if(e.key==="ArrowUp"||e.key===" ")jump=false;
  }

  window.addEventListener("keydown",keyDown);
  window.addEventListener("keyup",keyUp);

  let last=performance.now();
  let frames=0;
  let fpsStart=performance.now();

  function loop(now){
    const dt=Math.min(0.033,(now-last)/1000);
    last=now;

    frames++;

    if(now-fpsStart>=1000){
      document.getElementById("fpsValue").textContent=frames;
      frames=0;
      fpsStart=now;
    }

    if(left)player.x-=240*dt;
    if(right)player.x+=240*dt;

    velocityY+=1000*dt;

    if(jump && player.y>=350){
      velocityY=-480;
    }

    player.y+=velocityY*dt;

    if(player.y>=350){
      player.y=350;
      velocityY=0;
    }

    player.x=Math.max(
      0,
      Math.min(canvas.width-player.width,player.x)
    );

    ctx.clearRect(0,0,canvas.width,canvas.height);

    ctx.fillStyle="#101724";
    ctx.fillRect(0,0,canvas.width,canvas.height);

    objects.forEach(o=>{
      if(o.id===player.id)return;

      ctx.fillStyle=o.color||"#ffffff";

      if(o.type==="coin"){
        ctx.beginPath();
        ctx.arc(
          o.x+o.width/2,
          o.y+o.height/2,
          Math.min(o.width,o.height)/2,
          0,
          Math.PI*2
        );
        ctx.fill();
      }else{
        ctx.fillRect(o.x,o.y,o.width,o.height);
      }

      if(o.type==="text"){
        ctx.font="22px Arial";
        ctx.fillText(o.text||"",o.x,o.y+25);
      }
    });

    ctx.fillStyle=player.color||"#35a8ff";
    ctx.fillRect(
      player.x,
      player.y,
      player.width,
      player.height
    );

    ctx.fillStyle="#ffffff";
    ctx.font="14px Arial";
    ctx.fillText(
      "← → / A D to move • Space to jump",
      15,
      25
    );

    requestAnimationFrame(loop);
  }

  requestAnimationFrame(loop);
}

/* ============================================================
   RATINGS
   ============================================================ */

async function rateGame(gameId,rating){
  if(!currentUser){
    openAuth();
    return;
  }

  const {error}=await db
    .from("game_ratings")
    .upsert({
      game_id:gameId,
      reviewer_id:currentUser.id,
      rating
    },{
      onConflict:"game_id,reviewer_id"
    });

  if(error){
    alert(error.message);
    return;
  }

  alert("Your rating was saved.");
}

/* ============================================================
   PROFILE
   ============================================================ */

async function renderProfile(){
  if(!currentUser){
    openAuth();
    return;
  }

  const app=document.getElementById("app");

  const {data:games}=await db
    .from("games")
    .select("id,title,status,game_type")
    .eq("owner_id",currentUser.id)
    .order("created_at",{ascending:false});

  const initial=(currentProfile?.username||"U")
    .charAt(0)
    .toUpperCase();

  app.innerHTML=`
    <div class="profile">

      <div class="profile-head">
        <div class="avatar">${escapeHtml(initial)}</div>

        <div>
          <h2 style="margin:0">
            ${escapeHtml(currentProfile?.display_name||"METGAMES User")}
          </h2>

          <div style="color:#8290a8">
            @${escapeHtml(currentProfile?.username||"user")}
          </div>

          <div class="meta">
            <span class="tag">
              ${escapeHtml(currentProfile?.age_category||"")}
            </span>

            <span class="tag">
              Creator rating:
              ${Number(currentProfile?.creator_rating||0).toFixed(1)}
            </span>

            <span class="tag">
              Followers:
              ${currentProfile?.followers_count||0}
            </span>
          </div>
        </div>
      </div>

      <div class="section-title">
        <h2>Your Games</h2>
      </div>

      <div class="grid">
        ${(games||[]).length ? games.map(g=>`
          <article class="card">
            <div class="thumbnail">
              ${g.game_type.toUpperCase()}
            </div>

            <div class="card-body">
              <h3>${escapeHtml(g.title)}</h3>

              <div class="meta">
                <span class="tag">${escapeHtml(g.status)}</span>
              </div>

              <button
                class="btn"
                style="margin-top:12px"
                onclick="navigate('create')"
              >
                Creator
              </button>
            </div>
          </article>
        `).join("") : `
          <div class="empty">
            You haven't created a game yet.
          </div>
        `}
      </div>

    </div>
  `;
}

/* ============================================================
   UTILITIES
   ============================================================ */

function escapeHtml(value){
  return String(value??"")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}

function escapeAttr(value){
  return escapeHtml(value);
}

/* ============================================================
   STARTUP
   ============================================================ */

async function boot(){
  await refreshUser();

  const hash=location.hash;

  if(hash.startsWith("#game/")){
    const id=hash.substring("#game/".length);

    await navigate("game",{gameId:id});
  }else{
    await navigate("home");
  }
}

window.addEventListener("hashchange",async()=>{
  const hash=location.hash;

  if(hash.startsWith("#game/")){
    const id=hash.substring("#game/".length);
    await navigate("game",{gameId:id});
  }
});

boot();
</script>
