<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MetGames — A METXON Product</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
:root{
  --bg:#050a14;
  --panel:#0b1220;
  --panel2:#101b30;
  --line:#22314d;
  --text:#f4f7ff;
  --muted:#91a4c3;
  --cyan:#35d7ff;
  --blue:#55a8ff;
  --danger:#ff6b7a;
  --success:#5ee7a2;
  --radius:20px;
}

*{box-sizing:border-box}

html,body{
  margin:0;
  padding:0;
  min-height:100%;
  background:
    radial-gradient(circle at 75% 15%,rgba(37,105,180,.18),transparent 30%),
    radial-gradient(circle at 20% 30%,rgba(0,205,255,.07),transparent 25%),
    var(--bg);
  color:var(--text);
  font-family:Inter,Arial,sans-serif;
}

body{
  overflow-x:hidden;
}

button,input,select,textarea{
  font:inherit;
}

button{
  cursor:pointer;
}

a{
  color:inherit;
  text-decoration:none;
}

/* ---------------- HEADER ---------------- */

header{
  position:sticky;
  top:0;
  z-index:100;
  height:82px;
  display:flex;
  align-items:center;
  border-bottom:1px solid rgba(255,255,255,.08);
  background:rgba(4,9,18,.88);
  backdrop-filter:blur(18px);
}

.header-inner{
  width:min(1200px,calc(100% - 32px));
  margin:auto;
  display:flex;
  align-items:center;
  gap:18px;
}

.brand{
  display:flex;
  align-items:center;
  gap:12px;
  min-width:210px;
}

.brand img{
  width:54px;
  height:54px;
  object-fit:contain;
  border-radius:12px;
}

.brand-title{
  font-size:21px;
  font-weight:900;
  letter-spacing:.5px;
}

.brand-sub{
  color:#91a4c3;
  font-size:10px;
  letter-spacing:1.5px;
  margin-top:3px;
}

nav{
  display:flex;
  align-items:center;
  gap:4px;
  flex:1;
}

.nav-btn{
  border:0;
  background:transparent;
  color:#a9b8d0;
  padding:12px 14px;
  border-radius:12px;
  font-weight:700;
}

.nav-btn:hover,
.nav-btn.active{
  color:white;
  background:rgba(255,255,255,.07);
}

.header-right{
  display:flex;
  align-items:center;
  gap:8px;
}

.fps-pill{
  border:1px solid rgba(53,215,255,.28);
  background:rgba(53,215,255,.08);
  color:#7de7ff;
  padding:9px 12px;
  border-radius:12px;
  font-size:13px;
  font-weight:800;
  white-space:nowrap;
}

.outline-btn,
.primary-btn{
  border-radius:13px;
  padding:11px 16px;
  font-weight:900;
}

.outline-btn{
  border:1px solid #31415e;
  background:transparent;
  color:white;
}

.primary-btn{
  border:0;
  background:linear-gradient(135deg,#55b9ff,#38d7ef);
  color:#03101b;
}

.outline-btn:hover{
  background:rgba(255,255,255,.07);
}

.primary-btn:hover{
  filter:brightness(1.08);
}

/* ---------------- PAGE ---------------- */

main{
  width:min(1200px,calc(100% - 32px));
  margin:auto;
  padding:55px 0 80px;
}

.hero{
  display:grid;
  grid-template-columns:1.15fr .85fr;
  gap:55px;
  align-items:center;
  min-height:500px;
}

.kicker{
  color:#4edfff;
  font-size:12px;
  font-weight:900;
  letter-spacing:2px;
  margin-bottom:18px;
}

.hero h1{
  margin:0;
  font-size:clamp(58px,8vw,92px);
  line-height:.91;
  letter-spacing:-5px;
}

.hero p{
  color:#91acd2;
  font-size:19px;
  line-height:1.55;
  max-width:700px;
}

.hero-actions{
  display:flex;
  gap:12px;
  margin-top:26px;
  flex-wrap:wrap;
}

.hero-card{
  min-height:365px;
  border:1px solid #263b60;
  background:
    radial-gradient(circle at 50% 35%,rgba(65,145,255,.22),transparent 45%),
    linear-gradient(145deg,#11284a,#0b1427);
  border-radius:30px;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:45px;
  box-shadow:0 25px 80px rgba(0,0,0,.28);
}

.hero-card img{
  width:min(100%,270px);
  border-radius:20px;
}

.section{
  margin-top:50px;
}

.section-head{
  display:flex;
  justify-content:space-between;
  align-items:end;
  gap:15px;
  margin-bottom:20px;
}

.section-kicker{
  color:#42dbff;
  font-size:11px;
  font-weight:900;
  letter-spacing:2px;
}

.section h2{
  margin:5px 0 0;
  font-size:34px;
}

.muted{
  color:var(--muted);
}

/* ---------------- CARDS ---------------- */

.grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:18px;
}

.card{
  border:1px solid var(--line);
  background:linear-gradient(145deg,rgba(18,32,55,.88),rgba(7,14,26,.95));
  border-radius:20px;
  padding:18px;
  transition:.2s ease;
}

.card:hover{
  transform:translateY(-3px);
  border-color:#3c5d8b;
}

.game-thumb{
  height:150px;
  border-radius:15px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:35px;
  font-weight:900;
  background:
    radial-gradient(circle at 50% 30%,rgba(75,180,255,.3),transparent 50%),
    #101d33;
  margin-bottom:15px;
}

.card h3{
  margin:0 0 8px;
}

.card p{
  color:#91a4c3;
  line-height:1.5;
}

.tags{
  display:flex;
  gap:7px;
  flex-wrap:wrap;
  margin:12px 0;
}

.tag{
  font-size:11px;
  padding:6px 9px;
  border-radius:999px;
  background:#13233d;
  border:1px solid #263b5d;
  color:#9ec6ed;
}

.empty{
  border:1px dashed #2b3d59;
  border-radius:18px;
  padding:35px;
  text-align:center;
  color:#8296b6;
}

/* ---------------- MODAL ---------------- */

.modal-wrap{
  position:fixed;
  inset:0;
  z-index:500;
  display:none;
  align-items:center;
  justify-content:center;
  padding:20px;
  background:rgba(0,0,0,.72);
  backdrop-filter:blur(12px);
}

.modal-wrap.show{
  display:flex;
}

.modal{
  width:min(510px,100%);
  max-height:90vh;
  overflow:auto;
  border:1px solid #263b59;
  background:#08101e;
  border-radius:24px;
  padding:28px;
  box-shadow:0 30px 100px rgba(0,0,0,.6);
}

.modal h2{
  margin:0 0 8px;
  font-size:30px;
}

.modal-sub{
  color:#91a4c3;
  margin-bottom:25px;
}

.form-row{
  display:grid;
  gap:8px;
  margin-bottom:16px;
}

label{
  color:#9fb1ca;
  font-size:13px;
  font-weight:800;
}

input,select,textarea{
  width:100%;
  border:1px solid #273957;
  background:#0c1729;
  color:white;
  border-radius:12px;
  padding:13px 14px;
  outline:none;
}

input:focus,
select:focus,
textarea:focus{
  border-color:#45cfff;
  box-shadow:0 0 0 3px rgba(53,215,255,.08);
}

textarea{
  min-height:110px;
  resize:vertical;
}

.form-error{
  display:none;
  color:#ff9ba6;
  background:rgba(255,80,100,.08);
  border:1px solid rgba(255,80,100,.22);
  padding:12px;
  border-radius:12px;
  margin-bottom:14px;
}

.form-error.show{
  display:block;
}

.modal-actions{
  display:flex;
  gap:10px;
  margin-top:20px;
}

.modal-actions button{
  flex:1;
}

.switch-auth{
  text-align:center;
  margin-top:18px;
  color:#8499b8;
  font-size:14px;
}

.link-btn{
  background:none;
  border:0;
  color:#5fdfff;
  font-weight:800;
}

/* ---------------- GAME ---------------- */

.game-page{
  max-width:1000px;
  margin:auto;
}

.game-header{
  display:flex;
  justify-content:space-between;
  gap:20px;
  align-items:flex-start;
}

.game-header h1{
  margin:0;
  font-size:42px;
}

.game-meta{
  color:#8ea5c5;
  margin-top:10px;
}

.game-stage{
  margin-top:25px;
  border:1px solid #263b59;
  border-radius:22px;
  overflow:hidden;
  background:#02060d;
}

.game-toolbar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:12px 15px;
  background:#0b1424;
  border-bottom:1px solid #1c2b44;
}

.hud{
  display:flex;
  gap:12px;
  color:#8de7ff;
  font-size:12px;
  font-weight:800;
}

canvas{
  display:block;
  width:100%;
  max-height:620px;
  background:#07101d;
}

/* ---------------- PROFILE ---------------- */

.profile-box{
  max-width:800px;
  margin:auto;
  border:1px solid var(--line);
  background:linear-gradient(145deg,#0e1a2e,#080f1c);
  border-radius:24px;
  padding:30px;
}

.profile-top{
  display:flex;
  gap:20px;
  align-items:center;
}

.avatar{
  width:80px;
  height:80px;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:30px;
  font-weight:900;
  background:linear-gradient(135deg,#55a8ff,#35d7ff);
  color:#03101b;
}

.profile-name{
  font-size:28px;
  font-weight:900;
}

.profile-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:12px;
  margin-top:25px;
}

.stat{
  border:1px solid #233652;
  border-radius:15px;
  padding:18px;
  background:#0a1424;
}

.stat strong{
  display:block;
  font-size:22px;
}

/* ---------------- CREATE ---------------- */

.create-box{
  max-width:850px;
  margin:auto;
  border:1px solid var(--line);
  border-radius:24px;
  padding:28px;
  background:#091322;
}

.creator-note{
  border:1px solid #28405f;
  background:#0c1b30;
  padding:15px;
  border-radius:14px;
  color:#9eb4d1;
  margin-bottom:22px;
}

.editor-tools{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  margin:15px 0;
}

.object-btn{
  border:1px solid #29415f;
  background:#0e1c30;
  color:white;
  padding:9px 12px;
  border-radius:10px;
}

.object-list{
  display:grid;
  gap:8px;
}

.object-row{
  display:flex;
  justify-content:space-between;
  border:1px solid #223652;
  background:#0b1728;
  border-radius:12px;
  padding:12px;
}

.small-btn{
  border:1px solid #354b68;
  background:transparent;
  color:white;
  border-radius:8px;
  padding:5px 9px;
}

/* ---------------- TRANSITION ---------------- */

#transition{
  position:fixed;
  inset:0;
  z-index:1000;
  display:none;
  align-items:center;
  justify-content:center;
  background:#030711;
}

#transition.show{
  display:flex;
}

.transition-text{
  font-size:76px;
  font-weight:1000;
  letter-spacing:-5px;
  color:white;
}

.transition-text span{
  color:#43ddff;
}

/* ---------------- TOAST ---------------- */

#toast{
  position:fixed;
  right:20px;
  bottom:20px;
  z-index:900;
  max-width:360px;
  padding:14px 17px;
  border:1px solid #2b4263;
  background:#0c1729;
  color:white;
  border-radius:14px;
  box-shadow:0 20px 60px rgba(0,0,0,.45);
  display:none;
}

#toast.show{
  display:block;
}

/* ---------------- FOOTER ---------------- */

footer{
  border-top:1px solid rgba(255,255,255,.08);
  padding:30px 16px;
  color:#7186a5;
  text-align:center;
}

footer a{
  color:#53dfff;
}

/* ---------------- MOBILE ---------------- */

@media(max-width:900px){
  .hero{
    grid-template-columns:1fr;
  }

  .grid{
    grid-template-columns:1fr 1fr;
  }

  .brand{
    min-width:auto;
  }

  .brand-title{
    font-size:17px;
  }

  nav{
    overflow-x:auto;
  }

  .fps-pill{
    display:none;
  }
}

@media(max-width:650px){
  header{
    height:auto;
    padding:10px 0;
  }

  .header-inner{
    flex-wrap:wrap;
  }

  .brand{
    width:100%;
  }

  nav{
    order:3;
    width:100%;
  }

  .header-right{
    margin-left:auto;
  }

  .grid{
    grid-template-columns:1fr;
  }

  .hero h1{
    font-size:58px;
  }

  .game-header{
    flex-direction:column;
  }

  .profile-grid{
    grid-template-columns:1fr;
  }
}
</style>
</head>

<body>

<header>
  <div class="header-inner">

    <a class="brand" href="#home" onclick="navigate('home');return false;">
      <img src="image.png" alt="MetGames">
      <div>
        <div class="brand-title">METGAMES</div>
        <div class="brand-sub">A METXON PRODUCT</div>
      </div>
    </a>

    <nav>
      <button class="nav-btn" data-page="home" onclick="navigate('home')">Home</button>
      <button class="nav-btn" data-page="play" onclick="navigate('play')">Play</button>
      <button class="nav-btn" data-page="trailers" onclick="navigate('trailers')">Watch Trailers</button>
      <button class="nav-btn" data-page="create" onclick="navigate('create')">Create</button>
      <button class="nav-btn" data-page="profile" onclick="navigate('profile')">Profile</button>
    </nav>

    <div class="header-right">
      <div class="fps-pill">FPS <span id="headerFps">--</span></div>
      <button class="outline-btn" id="loginBtn" onclick="openLogin()">Log in</button>
      <button class="primary-btn" id="joinBtn" onclick="openJoin()">Join</button>
      <button class="outline-btn" id="logoutBtn" onclick="logout()" style="display:none">Log out</button>
    </div>

  </div>
</header>

<main id="app"></main>

<footer>
  <div>© 2026 METXON / METGAMES. All rights reserved.</div>
  <div style="margin-top:8px">
    Original METXON website:
    <a href="https://nidhilarthicknet.github.io/metxon/" target="_blank">
      nidhilarthicknet.github.io/metxon/
    </a>
  </div>
</footer>

<!-- LOGIN -->
<div class="modal-wrap" id="loginModal">
  <div class="modal">
    <h2>Log in</h2>
    <div class="modal-sub">Log in to play and create games.</div>

    <div class="form-error" id="loginError"></div>

    <div class="form-row">
      <label>Username</label>
      <input id="loginUsername" autocomplete="username" maxlength="24">
    </div>

    <div class="form-row">
      <label>Password</label>
      <input id="loginPassword" type="password" autocomplete="current-password">
    </div>

    <div class="modal-actions">
      <button class="outline-btn" onclick="closeModals()">Cancel</button>
      <button class="primary-btn" id="loginSubmit" onclick="login()">Log in</button>
    </div>

    <div class="switch-auth">
      New to MetGames?
      <button class="link-btn" onclick="switchToJoin()">Join</button>
    </div>
  </div>
</div>

<!-- JOIN -->
<div class="modal-wrap" id="joinModal">
  <div class="modal">
    <h2>Join MetGames</h2>
    <div class="modal-sub">Create an account to play and build.</div>

    <div class="form-error" id="joinError"></div>

    <div class="form-row">
      <label>Username</label>
      <input
        id="joinUsername"
        autocomplete="username"
        maxlength="24"
        placeholder="letters, numbers and _"
      >
    </div>

    <div class="form-row">
      <label>Display name</label>
      <input id="joinDisplayName" maxlength="80" placeholder="Your display name">
    </div>

    <div class="form-row">
      <label>Age category</label>
      <select id="joinAge">
        <option value="8_12">8–12</option>
        <option value="13_15">13–15</option>
        <option value="16_18">16–18</option>
        <option value="18_plus">18+</option>
      </select>
    </div>

    <div class="form-row">
      <label>Password</label>
      <input
        id="joinPassword"
        type="password"
        autocomplete="new-password"
        minlength="8"
        placeholder="At least 8 characters"
      >
    </div>

    <div class="modal-actions">
      <button class="outline-btn" onclick="closeModals()">Cancel</button>
      <button class="primary-btn" id="joinSubmit" onclick="join()">Create account</button>
    </div>

    <div class="switch-auth">
      Already have an account?
      <button class="link-btn" onclick="switchToLogin()">Log in</button>
    </div>
  </div>
</div>

<!-- TRANSITION -->
<div id="transition">
  <div class="transition-text">
    <span id="transitionMet">MET</span><span id="transitionXon" style="display:none">XON</span>
  </div>
</div>

<div id="toast"></div>

<script>
/* =========================================================
   METGAMES CONFIG
   ========================================================= */

const SUPABASE_URL = "https://xnnnxinsnedjafltsuqo.supabase.co";
const SUPABASE_KEY = "sb_publishable_86rJNEFS_sOXfsZZ6gr4ow_sLngjj_i";

const { createClient } = supabase;

const db = createClient(
  SUPABASE_URL,
  SUPABASE_KEY,
  {
    auth:{
      persistSession:false,
      autoRefreshToken:false,
      detectSessionInUrl:false
    }
  }
);

/* =========================================================
   STATE
   ========================================================= */

let currentUser = null;
let currentProfile = null;
let currentPage = "home";
let gamesCache = [];
let activeGame = null;
let animationId = null;
let fpsFrames = 0;
let fpsLast = performance.now();

/* =========================================================
   HELPERS
   ========================================================= */

function esc(value){
  return String(value ?? "")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}

function ageLabel(value){
  return ({
    "8_12":"8–12",
    "13_15":"13–15",
    "16_18":"16–18",
    "18_plus":"18+"
  })[value] || value || "—";
}

function friendlyError(error, fallback){
  const msg = String(error?.message || error || "");

  if(
    msg.includes("Failed to fetch") ||
    msg.includes("NetworkError") ||
    msg.includes("fetch")
  ){
    return "MetGames could not connect to the server. Please check your internet connection and try again.";
  }

  if(msg.includes("WEEKLY_GAME_LIMIT")){
    return "You have reached the Free Creator limit of 5 games this week.";
  }

  if(msg.includes("DAILY_PLAY_LIMIT")){
    return "You have reached today's free play limit for this type of game.";
  }

  if(msg.includes("LOGIN_REQUIRED")){
    return "Please log in first.";
  }

  return fallback || "MetGames could not complete that request.";
}

function toast(message){
  const el = document.getElementById("toast");
  el.textContent = message;
  el.classList.add("show");

  clearTimeout(window.__toastTimer);
  window.__toastTimer = setTimeout(()=>{
    el.classList.remove("show");
  },3500);
}

function setError(id,message){
  const el = document.getElementById(id);
  if(!el) return;

  el.textContent = message || "";
  el.classList.toggle("show",!!message);
}

function closeModals(){
  document.querySelectorAll(".modal-wrap").forEach(x=>x.classList.remove("show"));
}

function openLogin(){
  closeModals();
  setError("loginError","");
  document.getElementById("loginModal").classList.add("show");
}

function openJoin(){
  closeModals();
  setError("joinError","");
  document.getElementById("joinModal").classList.add("show");
}

function switchToJoin(){
  closeModals();
  openJoin();
}

function switchToLogin(){
  closeModals();
  openLogin();
}

/* =========================================================
   MET → XON TRANSITION
   ========================================================= */

async function transition(callback){
  const overlay = document.getElementById("transition");
  const met = document.getElementById("transitionMet");
  const xon = document.getElementById("transitionXon");

  overlay.classList.add("show");
  met.style.display = "inline";
  xon.style.display = "none";

  await wait(250);

  if(callback){
    await callback();
  }

  await wait(350);

  met.style.display = "none";
  xon.style.display = "inline";

  await wait(300);

  overlay.classList.remove("show");
}

function wait(ms){
  return new Promise(resolve=>setTimeout(resolve,ms));
}

/* =========================================================
   AUTH
   ========================================================= */

async function join(){

  setError("joinError","");

  const username = document.getElementById("joinUsername").value
    .trim()
    .toLowerCase();

  const displayName = document.getElementById("joinDisplayName").value.trim();

  const ageCategory = document.getElementById("joinAge").value;

  const password = document.getElementById("joinPassword").value;

  if(!/^[a-z0-9_]{3,24}$/.test(username)){
    setError(
      "joinError",
      "Username must be 3–24 characters and use only letters, numbers or underscores."
    );
    return;
  }

  if(password.length < 8){
    setError("joinError","Password must be at least 8 characters.");
    return;
  }

  const button = document.getElementById("joinSubmit");
  button.disabled = true;
  button.textContent = "Creating...";

  try{

    const {data,error} = await db.functions.invoke(
      "metgames-auth",
      {
        body:{
          action:"signup",
          username,
          displayName:displayName || username,
          ageCategory,
          password
        }
      }
    );

    if(error){
      throw error;
    }

    if(data?.error){
      throw new Error(data.error);
    }

    if(!data?.session){
      throw new Error("The account was created but could not be signed in.");
    }

    const {error:sessionError} = await db.auth.setSession({
      access_token:data.session.access_token,
      refresh_token:data.session.refresh_token
    });

    if(sessionError){
      throw sessionError;
    }

    currentUser = data.user;

    await loadProfile();

    closeModals();
    updateHeader();

    toast("Welcome to MetGames, @" + username + "!");

    await transition(async()=>{
      render("home");
    });

  }catch(error){

    setError(
      "joinError",
      friendlyError(error,"MetGames could not create the account. Please try again.")
    );

  }finally{

    button.disabled = false;
    button.textContent = "Create account";
  }
}

async function login(){

  setError("loginError","");

  const username = document.getElementById("loginUsername").value
    .trim()
    .toLowerCase();

  const password = document.getElementById("loginPassword").value;

  if(!username || !password){
    setError("loginError","Enter your username and password.");
    return;
  }

  const button = document.getElementById("loginSubmit");
  button.disabled = true;
  button.textContent = "Logging in...";

  try{

    const {data,error} = await db.functions.invoke(
      "metgames-auth",
      {
        body:{
          action:"login",
          username,
          password
        }
      }
    );

    if(error){
      throw error;
    }

    if(data?.error){
      throw new Error(data.error);
    }

    if(!data?.session){
      throw new Error("Login could not be completed.");
    }

    const {error:sessionError} = await db.auth.setSession({
      access_token:data.session.access_token,
      refresh_token:data.session.refresh_token
    });

    if(sessionError){
      throw sessionError;
    }

    currentUser = data.user;
    currentProfile = data.profile || null;

    if(!currentProfile){
      await loadProfile();
    }

    closeModals();
    updateHeader();

    toast("Logged in successfully.");

    await transition(async()=>{
      render(currentPage || "home");
    });

  }catch(error){

    setError(
      "loginError",
      friendlyError(error,"Username or password is incorrect.")
    );

  }finally{

    button.disabled = false;
    button.textContent = "Log in";
  }
}

async function logout(){

  try{
    await db.auth.signOut();
  }catch(_e){
    /* no raw Supabase error shown */
  }

  currentUser = null;
  currentProfile = null;

  updateHeader();

  toast("You have been logged out.");

  await transition(async()=>{
    render("home");
  });
}

async function loadProfile(){

  if(!currentUser){
    currentProfile = null;
    return;
  }

  try{

    const {data,error} = await db
      .from("profiles")
      .select("*")
      .eq("id",currentUser.id)
      .maybeSingle();

    if(error) throw error;

    currentProfile = data;

  }catch(_error){

    currentProfile = {
      id:currentUser.id,
      username:"player",
      display_name:"MetGames Player",
      age_category:"8_12"
    };

}

function updateHeader(){

  const loginBtn = document.getElementById("loginBtn");
  const joinBtn = document.getElementById("joinBtn");
  const logoutBtn = document.getElementById("logoutBtn");

  if(currentUser){
    loginBtn.style.display = "none";

async function loadGames(){

  try{

    const {data,error} = await db
      .from("games")
      .select("*")
      .eq("status","published")
      .order("published_at",{ascending:false});

    if(error) throw error;

    gamesCache = data || [];

  }catch(_error){

    /*
      Deliberately do not expose database errors to users.
      The three METXON starter games remain available as a
      local presentation fallback if the public query fails.
    */

    gamesCache = [
      {
        id:"demo-metxon-coin-dash",
        title:"METXON Coin Dash",
        description:"A fast starter game from METXON.",
        game_type:"2d",
        maturity_rating:"all",
        owner_id:null,
        status:"published"
      },
      {
        id:"demo-metxon-sky-jump",
        title:"METXON Sky Jump",
        description:"Jump through a simple sky challenge.",
        game_type:"2d",
        maturity_rating:"all",
        owner_id:null,
        status:"published"
      },
      {
        id:"demo-metxon-block-breaker",
        title:"METXON Block Breaker",
        description:"Break blocks in this classic-style starter.",
        game_type:"2d",
        maturity_rating:"all",
        owner_id:null,
        status:"published"
      }
    ];
  }

  return gamesCache;
}

async function getGame(id){

  const cached = gamesCache.find(g=>String(g.id)===String(id));

  if(cached && String(id).startsWith("demo-")){
    return cached;
  }

  try{

    const {data,error} = await db
      .from("games")
      .select("*")
      .eq("id",id)
      .maybeSingle();

    if(error) throw error;

    return data || cached || null;

  }catch(_error){

    return cached || null;
  }
}

async function getLatestVersion(gameId){

  try{

    const {data,error} = await db
      .from("game_versions")
      .select("*")
      .eq("game_id",gameId)
      .eq("status","published")
      .order("version_number",{ascending:false})
      .limit(1)
      .maybeSingle();

    if(error) throw error;

    return data || null;

  }catch(_error){

    return null;
  }
}

async function render(page){

  document.querySelectorAll(".nav-btn").forEach(btn=>{
    btn.classList.toggle(
      "active",
      btn.dataset.page===page
    );

  if(page==="home") await renderHome();

  else if(page==="trailers") await renderTrailers();

  else if(page==="profile") await renderProfile();
  else if(page.startsWith("game:")){
    await renderGame(page.split(":")[1]);

async function startGame(id){

  if(!currentUser){
    openLogin();
    return;
  }

  const game = await getGame(id);

  if(!game) return;

  if(!String(id).startsWith("demo-")){

    try{

      const {data,error} = await db.rpc(
        "increment_game_launch",
        {p_game_id:id}
      );

      if(error) throw error;

      if(data?.allowed===false){
        toast("Today's play limit has been reached.");
        return;
      }

    }catch(error){

      const message = friendlyError(
        error,
        "This game could not be launched right now."
      );

      if(String(error?.message || "").includes("DAILY_PLAY_LIMIT")){
        toast(message);
        return;
      }

      /*
        Do not expose database errors.
        For non-critical launch telemetry failures,
        continue into the runtime.
      */
    }
  }

  run2DGame(game);
}

function run2DGame(game){

  const canvas = document.getElementById("gameCanvas");

  if(!canvas) return;

  cancelAnimationFrame(animationId);

  const ctx = canvas.getContext("2d");

  const keys = {};

  const player = {
    x:100,
    y:350,
    vx:0,
    vy:0,
    size:30,
    grounded:false
  };

  window.onkeydown = e=>{
    keys[e.key.toLowerCase()] = true;

    if(
      ["arrowup","arrowdown","arrowleft","arrowright"," "].includes(
        e.key.toLowerCase()
      )
    ){
      e.preventDefault();
    }
  };

  window.onkeyup = e=>{
    keys[e.key.toLowerCase()] = false;
  };

  const platforms = [
    {x:0,y:450,w:900,h:50},
    {x:230,y:350,w:180,h:22},
    {x:500,y:275,w:170,h:22},
    {x:730,y:210,w:120,h:22}
  ];

  let last = performance.now();

  function frame(now){

    const dt = Math.min((now-last)/1000,.033);
    last = now;

    update(dt);
    draw();

    updateFPS();

    animationId = requestAnimationFrame(frame);
  }

  function update(dt){

    player.vx = 0;

    if(keys["arrowleft"] || keys["a"]){
      player.vx = -220;
    }

    if(keys["arrowright"] || keys["d"]){
      player.vx = 220;
    }

    if(
      (keys["arrowup"] || keys["w"] || keys[" "]) &&
      player.grounded
    ){
      player.vy = -430;
      player.grounded = false;
    }

    player.vy += 950*dt;

    player.x += player.vx*dt;
    player.y += player.vy*dt;

    if(player.x<0) player.x=0;

    if(player.x+player.size>900){
      player.x=900-player.size;
    }

    player.grounded=false;

    for(const p of platforms){

      const horizontal =
        player.x < p.x+p.w &&
        player.x+player.size > p.x;

      const falling =
        player.vy >= 0;

      const bottom =
        player.y+player.size;

      if(horizontal && falling && bottom>=p.y && bottom<=p.y+28){

        player.y=p.y-player.size;
        player.vy=0;
        player.grounded=true;
      }
    }

    if(player.y>520){

      player.x=100;
      player.y=350;
      player.vy=0;
    }
  }

  function draw(){

    ctx.clearRect(0,0,900,500);

    const gradient=ctx.createLinearGradient(0,0,0,500);
    gradient.addColorStop(0,"#081a31");
    gradient.addColorStop(1,"#040a13");

    ctx.fillStyle=gradient;
    ctx.fillRect(0,0,900,500);

    /* stars */
    ctx.fillStyle="#21486c";

    for(let i=0;i<35;i++){

      const x=(i*97)%900;
      const y=(i*53)%330;

      ctx.fillRect(x,y,2,2);
    }

    /* platforms */

    for(const p of platforms){

      ctx.fillStyle="#17365a";
      ctx.fillRect(p.x,p.y,p.w,p.h);

      ctx.fillStyle="#42d9ff";
      ctx.fillRect(p.x,p.y,p.w,3);
    }

    /* player */

    ctx.fillStyle="#55b8ff";
    ctx.fillRect(
      player.x,
      player.y,
      player.size,
      player.size
    );

    ctx.fillStyle="#dffaff";
    ctx.fillRect(
      player.x+7,
      player.y+7,
      6,
      6
    );

    ctx.fillRect(
      player.x+18,
      player.y+7,
      6,
      6
    );

    ctx.fillStyle="#9eb4d1";
    ctx.font="13px Arial";
    ctx.textAlign="left";
    ctx.fillText(
      game.title || "MetGames",
      18,
      25
    );
  }

  animationId=requestAnimationFrame(frame);
}

/* =========================================================
   FPS
   ========================================================= */

function updateFPS(){

  fpsFrames++;

  const now=performance.now();

  if(now-fpsLast>=1000){

    const fps=Math.round(
      fpsFrames*1000/(now-fpsLast)
    );

    fpsFrames=0;
    fpsLast=now;

    document.getElementById("headerFps").textContent=fps;

    const gameFps=document.getElementById("gameFps");

    if(gameFps){
      gameFps.textContent=fps;
    }
  }
}

async function createGame(){

  const title=document.getElementById("gameTitle").value.trim();
  const description=document.getElementById("gameDescription").value.trim();
  const gameType=document.getElementById("gameType").value;
  const maturity=document.getElementById("gameRating").value;

  if(!title){
    setError("createError","Enter a game title.");

  const button=document.getElementById("createGameBtn");

  button.disabled=true;
  button.textContent="Creating...";

  try{

    const {data,error}=await db.rpc(
      "create_game",
      {
        p_title:title,
        p_description:description,
        p_game_type:gameType,
        p_maturity_rating:maturity
      }
    );

    if(error) throw error;

    if(!data){
      throw new Error("Game project could not be created.");

    toast("Game project created.");

    await transition(async()=>{
      renderMyGame(data);
    });

  }catch(error){

    setError(
      "createError",
      friendlyError(
        error,
        "MetGames could not create your game project."
      )
    );

  }finally{

    button.disabled=false;
    button.textContent="Create project";

function addEditorObject(type){

    type,
    x:100 + window.__editorObjects.length*35,
    y:100,
    width:type==="Text"?180:40,
    height:type==="Text"?35:40
  });

  drawEditorObjects();
}

function drawEditorObjects(){

  const box=document.getElementById("editorObjects");

  if(!box) return;

  if(!window.__editorObjects.length){
    box.innerHTML=`
      <div class="empty">
        Add objects to begin.
      </div>
    `;
    return;
  }

  box.innerHTML=window.__editorObjects.map((obj,index)=>`
    <div class="object-row">
      <div>
        <strong>${esc(obj.type)}</strong>
        <div class="muted">
          x:${obj.x} · y:${obj.y}
        </div>
      </div>

      <button
        class="small-btn"
        onclick="removeEditorObject(${index})"
      >
        Remove
      </button>
    </div>
  `).join("");
}

function removeEditorObject(index){

  window.__editorObjects.splice(index,1);
  drawEditorObjects();
}

async function saveEditor(gameId){

  if(!currentUser || !window.__editorObjects){
    toast("Please log in again.");
    return;
  }

  try{

    const {data:version,error:versionError}=await db
      .from("game_versions")
      .select("*")
      .eq("game_id",gameId)
      .eq("status","draft")
      .order("version_number",{ascending:false})
      .limit(1)
      .maybeSingle();

    if(versionError) throw versionError;

    if(!version){
      throw new Error("Draft version not found.");
    }

    const manifest={
      engine:"metgames-2d-mvp",
      schema:1,
      objects:window.__editorObjects
    };

    const {error}=await db
      .from("game_versions")
      .update({
        asset_manifest:manifest
      })
      .eq("id",version.id)
      .eq("created_by",currentUser.id);

    if(error) throw error;

    toast("Project saved to Supabase.");

  }catch(error){

    toast(
      friendlyError(
        error,
        "The project could not be saved."
      )
    );
  }
}

/* =========================================================
   PROFILE
   ========================================================= */

async function renderProfile(){

  const app=document.getElementById("app");

  if(!currentUser){
    app.innerHTML=`
      <section class="section">
        <div class="empty">
          Log in to view your MetGames profile.
          <br><br>
          <button class="primary-btn" onclick="openLogin()">
            Log in
          </button>
        </div>
      </section>
    `;
    return;
  }

  await loadProfile();

  const username=currentProfile?.username || "player";
  const display=currentProfile?.display_name || username;

  app.innerHTML=`
    <section class="profile-box">

      <div class="profile-top">

        <div class="avatar">
          ${esc(username.charAt(0).toUpperCase())}
        </div>

        <div>
          <div class="profile-name">
            ${esc(display)}
          </div>

          <div class="muted">
            @${esc(username)}
          </div>
        </div>

      </div>

      <div class="profile-grid">

        <div class="stat">
          <strong>Creator</strong>
          <span class="muted">MetGames</span>
        </div>

        <div class="stat">
          <strong>
            ${ageLabel(currentProfile?.age_category)}
          </strong>
          <span class="muted">Age category</span>
        </div>

        <div class="stat">
          <strong>
            ${Number(currentProfile?.followers_count || 0)}
          </strong>
          <span class="muted">Followers</span>
        </div>

      </div>

      <div style="margin-top:25px">
        <button class="outline-btn" onclick="navigate('create')">
          Creator Studio
        </button>
      </div>

    </section>
  `;
}

/* =========================================================
   HASH ROUTING
   ========================================================= */

function handleHash(){

  const hash=location.hash.replace(/^#/,"");

  if(!hash || hash==="home"){
    render("home");
    return;
  }

  if(hash.startsWith("game/")){
    render("game:"+hash.split("/")[1]);
    return;
  }

  if(["play","trailers","create","profile"].includes(hash)){
    render(hash);
    return;
  }

  render("home");
}

window.addEventListener("hashchange",handleHash);

/* =========================================================
   STARTUP
   ========================================================= */

(async function(){

  /*
    persistSession:false means we intentionally do not use
    localStorage/sessionStorage for authentication persistence.
  */

  updateHeader();

  await render("home");

})();
</script>
